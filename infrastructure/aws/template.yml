AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  Document AI processing pipeline.
  S3 -> SQS -> Fargate document worker

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  QueueVisibilityTimeout:
    Type: Number
    Default: 900
    Description: >
      Time in seconds that a message remains invisible while being processed.

  SqsVisibilityHeartbeatSeconds:
    Type: Number
    Default: 300
    MinValue: 30
    Description: Interval at which the Fargate worker renews SQS visibility and its DynamoDB lease.

  OllamaReadTimeout:
    Type: Number
    Default: 1800
    MinValue: 60
    Description: Read timeout in seconds for one Fargate request to Ollama; this is per generation, not per document.

  OllamaNumCtx:
    Type: Number
    Default: 16384
    MinValue: 4096
    Description: Ollama context per request; must fit the rendered image and thinking pass without truncation.

  OllamaPageNumPredict:
    Type: Number
    Default: 6000
    MinValue: 1
    Description: Maximum generated tokens for one page extraction request.

  OllamaSynthesisNumPredict:
    Type: Number
    Default: 2000
    MinValue: 1
    Description: Maximum generated tokens for final document synthesis.

  DocumentProcessorUrl:
    Type: String
    Default: http://document-processor:8000/process
    Description: >
      Local mode only: full HTTP URL of the local document-processor endpoint.

  ProcessorDeployment:
    Type: String
    Default: fargate
    AllowedValues:
      - local
      - fargate
    Description: Use the existing local processor endpoint or the AWS Fargate service.

  OllamaBaseUrl:
    Type: String
    Default: https://la-ea.duckdns.org:11443
    Description: HTTPS endpoint for the Ollama reverse proxy; TLS verification remains enabled.

  OllamaIPv4Cidr:
    Type: String
    Default: 99.35.202.200/32
    Description: Destination range allowed for document-processor Ollama traffic.

  OllamaModel:
    Type: String
    Default: qwen3-vl:8b-instruct

  DebugModelOutput:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'false'
      - 'true'
    Description: Temporarily log the exact Ollama message.content after structured-output validation failures. Contains document data; keep false except during a controlled diagnosis.

  DocumentProcessorImageTag:
    Type: String
    Default: latest
    Description: Image tag pushed to the stack's ECR repository.

  DocumentProcessorDesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 2
    Description: Start at zero until the image is pushed to ECR, then update to one.

  ProcessorMaxConcurrentJobs:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 2
    Description: Maximum SQS messages processed concurrently inside each Fargate task; set to 2 after validating Ollama capacity.

  VpcCidr:
    Type: String
    Default: 10.40.0.0/16

  PublicSubnetCidr:
    Type: String
    Default: 10.40.1.0/24

  FrontendOrigin:
    Type: String
    Default: https://dfw9n3vcykvho.cloudfront.net
    Description: Browser origin allowed to upload documents and call the jobs API.

  MaxUploadBytes:
    Type: Number
    Default: 20971520
    Description: Maximum accepted PDF size in bytes.

  MaxUserJobs:
    Type: Number
    Default: 20
    MinValue: 1
    Description: Maximum number of retained jobs and results per Cognito user.

Globals:

  Function:
    Runtime: python3.12
    Timeout: 900
    MemorySize: 512

Conditions:
  DeployProcessorOnFargate: !Equals [!Ref ProcessorDeployment, fargate]
  UseLegacyLambdaProcessor: !Equals [!Ref ProcessorDeployment, local]

Modules:
  - stacks/auth.yml
  - stacks/storage.yml
  - stacks/messaging.yml
  - stacks/processor-network.yml
  - stacks/processor.yml
  - stacks/api.yml

# Source manifest: assemble with assemble_template.py before SAM commands.
Outputs:

  DocumentsBucketName:
    Description: S3 bucket used for document uploads
    Value: !Ref DocumentsBucket

  ResultsBucketName:
    Description: S3 bucket used for processed document results
    Value: !Ref ResultsBucket

  JobsTableName:
    Description: DynamoDB table used for job state and user prompts
    Value: !Ref JobsTable

  DocumentQueueUrl:
    Description: SQS document processing queue URL
    Value: !Ref DocumentQueue

  DocumentQueueArn:
    Description: SQS document processing queue ARN
    Value: !GetAtt DocumentQueue.Arn

  DeadLetterQueueUrl:
    Description: SQS dead letter queue URL
    Value: !Ref DocumentDeadLetterQueue

  DocumentProcessorFunctionArn:
    Description: Document processor Lambda ARN
    Value: !GetAtt DocumentProcessorFunction.Arn

  JobsApiUrl:
    Description: API base URL for creating and querying document jobs
    Value: !Sub "https://${JobsApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"

  CognitoUserPoolId:
    Description: Cognito User Pool ID for the SPA
    Value: !Ref UserPool

  CognitoUserPoolClientId:
    Description: Public Cognito User Pool Client ID for the SPA
    Value: !Ref UserPoolClient

  CognitoRegion:
    Description: AWS region containing the Cognito User Pool
    Value: !Ref AWS::Region

  DocumentProcessorRepositoryUri:
    Condition: DeployProcessorOnFargate
    Description: ECR repository URI for the document-processor container
    Value: !GetAtt DocumentProcessorRepository.RepositoryUri

  OllamaApiTokenSecretArn:
    Condition: DeployProcessorOnFargate
    Description: Empty Secrets Manager secret; set its value before starting Fargate tasks.
    Value: !Ref OllamaApiTokenSecret

  DocumentProcessorClusterName:
    Condition: DeployProcessorOnFargate
    Description: ECS cluster hosting document-processor
    Value: !Ref ProcessorCluster

  DocumentProcessorServiceName:
    Condition: DeployProcessorOnFargate
    Description: ECS service hosting document-processor
    Value: document-processor

  DocumentProcessorPrivateUrl:
    Condition: DeployProcessorOnFargate
    Description: Private diagnostic endpoint for the document processor
    Value: !Sub "http://document-processor.${Environment}.internal:8000/process"

  ProcessorVpcId:
    Condition: DeployProcessorOnFargate
    Description: VPC hosting the Fargate document processor
    Value: !Ref ProcessorVpc
