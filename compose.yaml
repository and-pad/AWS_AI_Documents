services:
  document-processor:
    build:
      context: ./document-processor
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-${OLLAMA_URL:-http://host.docker.internal:11435}}
      OLLAMA_API_TOKEN: ${OLLAMA_API_TOKEN:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-vl:8b-instruct}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      PDF_RENDER_DPI: ${PDF_RENDER_DPI:-180}
      DEBUG_MODEL_OUTPUT: ${DEBUG_MODEL_OUTPUT:-false}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-16384}
      OLLAMA_PAGE_NUM_PREDICT: ${OLLAMA_PAGE_NUM_PREDICT:-6000}
      OLLAMA_SYNTHESIS_NUM_PREDICT: ${OLLAMA_SYNTHESIS_NUM_PREDICT:-2000}
      OLLAMA_READ_TIMEOUT: ${OLLAMA_READ_TIMEOUT:-1800}
      OLLAMA_COORDINATOR_QUEUE_WAIT_SECONDS: ${OLLAMA_COORDINATOR_QUEUE_WAIT_SECONDS:-120}
      PROCESSOR_MAX_CONCURRENT_JOBS: ${PROCESSOR_MAX_CONCURRENT_JOBS:-1}
    restart: unless-stopped
